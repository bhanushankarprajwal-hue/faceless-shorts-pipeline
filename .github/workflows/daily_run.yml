name: Daily Shorts Story Pipeline

on:
  schedule:
    # Runs at 00:30 UTC = 6:00 AM IST every day
    - cron: "30 0 * * *"
  workflow_dispatch:  # lets you manually trigger a run from the Actions tab too

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Step 1 - Fetch RSS feeds
        working-directory: src
        run: python fetch_feeds.py

      - name: Step 2 - Duplicate filter (Layer 1)
        working-directory: src
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python dedup_check.py

      - name: Step 3 - Score candidates with Gemini
        working-directory: src
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python score_candidates.py

      - name: Step 4 - Verify facts
        working-directory: src
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python verify_facts.py

      - name: Step 5 - Generate final script package
        working-directory: src
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_package.py

      - name: Step 6 - Write results to Google Sheet
        working-directory: src
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python sheets_writer.py

      - name: Commit data files back to repo (for debugging/history)
        run: |
          git config user.name "shorts-pipeline-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daily pipeline run: $(date -u +'%Y-%m-%d')"
          git push
